name: Windows-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip
          .\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin MyPassword@123 /add
          net localgroup administrators runneradmin /add
      - name: Start Tunnel
        run: |
          Start-Process powershell -ArgumentList ".\ngrok\ngrok.exe tcp 3389"
          Start-Sleep -Seconds 10
          $tunnels = (Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels).tunnels
          Write-Output "RDP Address: $($tunnels[0].public_url -replace 'tcp://', '')"
      - name: Keep Alive (6 Hours)
        run: Start-Sleep -Seconds 21600
