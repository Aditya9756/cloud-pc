name: Windows-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin MyPassword@123
      - name: Install & Setup Ngrok
        run: |
          choco install ngrok -y
          ngrok config add-authtoken 3CKVKrAcEEoXkxOA5b5oNpxkLMF_7gjJ8waspaNmuuLHKeXm4
          Start-Process ngrok -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 15
          $tunnels = (Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels).tunnels
          $rdp = $tunnels[0].public_url -replace "tcp://", ""
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "RDP Address : $rdp" -ForegroundColor Yellow
          Write-Host "Username    : runneradmin" -ForegroundColor Cyan
          Write-Host "Password    : MyPassword@123" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host ""
      - name: Keep Alive
        run: Start-Sleep -Seconds 21600
