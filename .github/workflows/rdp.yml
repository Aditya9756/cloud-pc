name: Windows-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin MyPassword@123
      - name: Install Node.js and LocalTunnel
        run: |
          npm install -g localtunnel
      - name: Start RDP Tunnel
        shell: powershell
        run: |
          Write-Host "Starting LocalTunnel for RDP (Port 3389)..." -ForegroundColor Cyan
          Start-Process -FilePath "lt" -ArgumentList "--port 3389"
          Start-Sleep -Seconds 8
          
          # LocalTunnel public URL fetch karne ke liye
          try {
            $response = Invoke-RestMethod -Uri "https://loca.lt/mytunnelpassword"
            Write-Host "==========================================" -ForegroundColor Green
            Write-Host "Your LocalTunnel IP/Domain (Use in RD Client):" -ForegroundColor Yellow
            Write-Host $response -ForegroundColor Cyan
            Write-Host "Username : runneradmin" -ForegroundColor Green
            Write-Host "Password : MyPassword@123" -ForegroundColor Green
            Write-Host "==========================================" -ForegroundColor Green
          } catch {
            Write-Host "Tunnel started. Check terminal logs above for URL." -ForegroundColor Yellow
          }
      - name: Keep Alive (6 Hours)
        run: Start-Sleep -Seconds 21600
